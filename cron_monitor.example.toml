# =============================================================================
# cron_monitor configuration - copy to /etc/cron_monitor.toml (or pass -c <path>)
# Requires Python >= 3.11. See src/cron_monitor/cli.py for the full documentation.
# =============================================================================

[defaults]
# Base ping URL of your healthchecks instance (without the check UUID).
# For hosted healthchecks.io this is "https://hc-ping.com";
# for self-hosted instances e.g. "https://hc.example.com/hc/ping".
ping_base = "https://hc-ping.com"

# Directories. Relative paths resolve against the directory of this file.
# spool_dir holds pings that could not be delivered (retry queue on disk).
# log_dir  gets one sub-directory per job with per-run log files.
# lock_dir holds the per-job flock files.
# spool_dir = "/var/spool/cron_monitor"
# log_dir   = "/var/log/cron_monitor"
# lock_dir  = "/run/lock/cron_monitor"

# Hard kill after this many seconds (per job overridable).
timeout = 3600

# What to do when the previous run of this job is still active (its flock is
# held) and cron starts a new run. In all cases the new run's command is NOT
# started:
#   skip           - new run exits immediately with code 3, no ping; the
#                    running job is left untouched. With ping_on_skip = true
#                    a success ping (with a note) is sent anyway so the
#                    check does not go late during a long, healthy run.
#   fail           - the collision is treated as an error: a /fail ping is
#                    sent, exit code 1. Use when overlaps should never
#                    happen and you want to be alerted.
#   kill_previous  - the new run takes over: SIGTERM (then SIGKILL after 2 s)
#                    is sent to the previous run's process group, the lock is
#                    taken and the new run proceeds. Falls back to "skip"
#                    behaviour if killing/acquiring fails.
# (per job overridable)
on_overlap = "skip"

# Write stdout+stderr of each run to a per-run log file under log_dir
# (default: true). Set to false if the job already logs itself; then the
# job's output passes through to the monitor's own stdout/stderr and the
# /fail ping carries no log tail.
log_to_file = true

# --- Jobs -------------------------------------------------------------------
# One table per cron job. `uuid` is the check UUID from the healthchecks UI
# (replace the placeholders below). The crontab only references the job name:
#   0 3 * * * ~/.local/bin/cron-monitor -c /srv/project/cron_monitor.toml run collect-stats

[jobs.collect-stats]
uuid = "00000000-0000-0000-0000-000000000001"
command = ["/usr/bin/python3", "/srv/project/collect.py"]
cwd = "/srv/project"
timeout = 1800
on_overlap = "kill_previous"

[jobs.collect-stats.env]
PYTHONUNBUFFERED = "1"

[jobs.db-backup]
uuid = "00000000-0000-0000-0000-000000000002"
command = ["/srv/project/backup.sh"]
timeout = 7200
on_overlap = "skip"
